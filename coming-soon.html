<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Pergola — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal: #1c1b18;
    --shadow-dark: #100f0d;
    --oak: #d8c4a0;
    --cream: #f1e9dc;
    --sky: #8aa2ab;
    --amber: #c97d40;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background: var(--charcoal);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  .stage{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Pergola slat shadow effect — dappled light drifting across the scene */
  .slats{
    position:absolute;
    inset:-10% -10%;
    background: repeating-linear-gradient(
      70deg,
      transparent 0px,
      transparent 46px,
      rgba(0,0,0,0.38) 46px,
      rgba(0,0,0,0.38) 78px
    );
    mix-blend-mode: multiply;
    animation: drift 34s linear infinite;
    opacity: 0.9;
  }

  .glow{
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse 60% 50% at 50% 38%, rgba(201,125,64,0.16), transparent 70%);
    pointer-events:none;
  }

  @keyframes drift{
    0%   { transform: translate3d(0,0,0); }
    100% { transform: translate3d(120px, 60px, 0); }
  }

  .content{
    position:relative;
    z-index:2;
    text-align:center;
    padding: 0 24px;
    max-width: 640px;
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--sky);
    margin-bottom: 28px;
    opacity: 0;
    animation: rise 0.9s ease-out 0.15s forwards;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight: 500;
    font-optical-sizing: auto;
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--cream);
    margin-bottom: 22px;
    opacity: 0;
    animation: rise 0.9s ease-out 0.35s forwards;
  }

  h1 em{
    font-style: italic;
    font-weight: 300;
    color: var(--oak);
  }

  p.sub{
    font-size: 17px;
    line-height: 1.6;
    color: rgba(241,233,220,0.72);
    max-width: 460px;
    margin: 0 auto;
    opacity: 0;
    animation: rise 0.9s ease-out 0.55s forwards;
  }

  .rule{
    width: 44px;
    height: 1px;
    background: var(--amber);
    margin: 34px auto;
    opacity: 0;
    animation: rise 0.9s ease-out 0.7s forwards;
  }

  .contact{
    font-size: 14px;
    color: rgba(241,233,220,0.55);
    opacity: 0;
    animation: rise 0.9s ease-out 0.85s forwards;
  }

  .contact a{
    color: var(--sky);
    text-decoration: none;
    border-bottom: 1px solid rgba(138,162,171,0.35);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .contact a:hover{
    color: var(--oak);
    border-color: var(--oak);
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .slats{ animation: none; }
    .eyebrow, h1, p.sub, .rule, .contact{ animation: none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="slats"></div>
    <div class="glow"></div>

    <div class="content">
      <div class="eyebrow">Galaxy Pergola</div>
      <h1>We're under<br><em>the shade</em>, for now.</h1>
      <p class="sub">Our site is being refreshed. We'll be back shortly — thank you for your patience.</p>
      <div class="rule"></div>
      <div class="contact">Get in touch at <a href="mailto:sales@galaxypergola.co.nz">sales@galaxypergola.co.nz</a></div>
    </div>
  </div>

</body>
</html>
